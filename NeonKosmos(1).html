<style>

canvas{position:fixed;top:0;left:0;right:0;bottom:0;width:100%;height:100%}

h2{margin:0 0 14px;color:var(--ac)}
p{margin:6px 0 16px;opacity:.75;font-size:14px}
button{display:block;width:100%;margin:9px 0;padding:13px;font-size:17px;font-weight:700;color:var(--fg);background:#101a44;border:1px solid var(--ac);border-radius:12px;cursor:pointer;transition:.15s}
button:hover{background:var(--ac);color:#001018;box-shadow:0 0 20px var(--ac)}
label{display:flex;justify-content:space-between;align-items:center;gap:14px;margin:12px 0;font-size:15px;text-align:left}
input[type=range]{width:150px;accent-color:var(--ac)}
select{background:#101a44;color:var(--fg);border:1px solid var(--ac);border-radius:8px;padding:6px}
input[type=checkbox]{width:20px;height:20px;accent-color:var(--ac)}
input{-webkit-user-select:text;user-select:text}
html,body{overscroll-behavior:none}.pn{max-height:92vh;overflow-y:auto}
#tb{position:fixed;top:calc(env(safe-area-inset-top,0px) + 8px);left:50%;transform:translateX(-50%);display:flex;gap:8px;z-index:5}
#tb button{width:auto;margin:0;padding:7px 13px;font-size:18px;border-radius:10px;background:rgba(10,14,35,.7)}
@media(max-height:640px){h1{font-size:28px}.pn{padding:16px 20px}button{padding:10px;margin:6px 0}}
.hid{display:none!important}
.sc{font-size:34px;color:var(--ac2);font-weight:800}

`.split('\n').forEach(l=>{const a=l.split('|');if(a.length==3)D[a[0].trim()]=[a[1].trim(),a[2].trim()]});
const tr=s=>{const e=D[s];return !e||S.lang==='uz'?s:e[S.lang==='ru'?0:1]};
const HELP={uz:'🖥 <b>Kompyuter:</b> WASD / strelkalar yoki sichqoncha bilan sudrash, o\'q avtomatik, P / Esc — pauza<br>📱 <b>Telefon:</b> barmoq bilan kemani suring<br>🟦 P — qurol kuchayadi · 🟩 S — qalqon · 🟥 + — jon · 🪙 — tanga<br>⏱ Har 60 soniyada hodisa: meteorit, botlar hujumi, tanga yomg\'iri, tez otish<br>👾 Har level oxirida BOSS<br>🛒 Tangaga yangi kemalar sotib oling',ru:'🖥 <b>Компьютер:</b> WASD / стрелки или перетаскивание мышью, стрельба автоматическая, P / Esc — пауза<br>📱 <b>Телефон:</b> двигайте корабль пальцем<br>🟦 P — усиление оружия · 🟩 S — щит · 🟥 + — жизнь · 🪙 — монета<br>⏱ Каждые 60 секунд событие: метеориты, атака ботов, дождь монет, скорострельность<br>👾 В конце каждого уровня БОСС<br>🛒 Покупайте новые корабли за монеты',en:'🖥 <b>Computer:</b> WASD / arrows or drag with the mouse, auto-fire, P / Esc — pause<br>📱 <b>Phone:</b> drag the ship with your finger<br>🟦 P — weapon upgrade · 🟩 S — shield · 🟥 + — life · 🪙 — coin<br>⏱ Event every 60 seconds: meteors, bot attack, coin rain, rapid fire<br>👾 BOSS at the end of every level<br>🛒 Buy new ships with coins'};
const AUTH={uz:'Muallif ushbu o\'yinni tashkil qilgan va 1 ta o\'zi yaratgan.<br><b>Yosh: 13</b>',ru:'Автор организовал эту игру и создал её один.<br><b>Возраст: 13</b>',en:'The author organized this game and created it all by himself.<br><b>Age: 13</b>'};
const OR=new WeakMap();
function applyLang(){const w=document.createTreeWalker($('ui'),4);let n;while(n=w.nextNode()){const v=n.nodeValue.trim();if(!v)continue;if(!OR.has(n))OR.set(n,v);n.nodeValue=tr(OR.get(n))}}
function syncUI(){$('sMus').value=S.mus;$('sSfx').value=S.sfx;$('sDif').value=S.dif;$('sPar').checked=S.par;$('sShk').checked=S.shk;$('sFps').checked=S.fps;$('sLang').value=S.lang;$('best').textContent=tr('🏆 Rekord')+': '+S.best+'   🪙 '+S.coins}
syncUI();
$('sMus').oninput=e=>{S.mus=+e.target.value;vol();save()};
$('sSfx').oninput=e=>{S.sfx=+e.target.value;vol();save();sfx('pick')};
$('sDif').onchange=e=>{S.dif=+e.target.value;save()};
$('sPar').onchange=e=>{S.par=e.target.checked;save()};
$('sShk').onchange=e=>{S.shk=e.target.checked;save()};
$('sFps').onchange=e=>{S.fps=e.target.checked;save()};
$('sLang').onchange=e=>{S.lang=e.target.value;save();applyLang();syncUI()};
// ---- audio
let ac,mg,sg,nb,mstep=0,mnext=0;
function initA(){if(ac){if(ac.state==='suspended')ac.resume();return}
 ac=new (window.AudioContext||window.webkitAudioContext)();mg=ac.createGain();sg=ac.createGain();mg.connect(ac.destination);sg.connect(ac.destination);vol();
 nb=ac.createBuffer(1,ac.sampleRate,ac.sampleRate);const d=nb.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
 mnext=ac.currentTime+.1;setInterval(music,100)}
function vol(){if(!ac)return;mg.gain.value=S.mus/100*.5;sg.gain.value=S.sfx/100*.7}
function tone(t,f,f2,dur,type,v,dest){const o=ac.createOscillator(),gn=ac.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+dur);gn.gain.setValueAtTime(v,t);gn.gain.exponentialRampToValueAtTime(.001,t+dur);o.connect(gn);gn.connect(dest);o.start(t);o.stop(t+dur+.02)}
function noise(t,dur,v,fc,dest){const s=ac.createBufferSource(),f=ac.createBiquadFilter(),gn=ac.createGain();s.buffer=nb;f.type='lowpass';f.frequency.value=fc;gn.gain.setValueAtTime(v,t);gn.gain.exponentialRampToValueAtTime(.001,t+dur);s.connect(f);f.connect(gn);gn.connect(dest);s.start(t);s.stop(t+dur)}
function sfx(k){if(!ac)return;const t=ac.currentTime;
 if(k==='shoot')tone(t,900,200,.09,'square',.12,sg);
 else if(k==='hit')tone(t,300,90,.08,'sawtooth',.18,sg);
 else if(k==='boom'){noise(t,.4,.7,1500,sg);tone(t,140,30,.35,'sine',.5,sg)}
 else if(k==='hurt'){noise(t,.5,.9,900,sg);tone(t,200,50,.5,'sawtooth',.3,sg)}
 else if(k==='pick'){[523,659,784,1046].forEach((f,i)=>tone(t+i*.05,f,0,.12,'triangle',.25,sg))}
 else if(k==='over'){[400,320,250,160].forEach((f,i)=>tone(t+i*.22,f,f*.8,.3,'sawtooth',.25,sg))}
 else if(k==='start'){[330,440,660,880].forEach((f,i)=>tone(t+i*.07,f,0,.15,'square',.15,sg))}}
const N=[57,60,64,60, 55,59,62,59, 53,57,60,57, 52,55,59,55],BS=[33,31,29,28];
const mf=n=>440*Math.pow(2,(n-69)/12);
function music(){if(!ac)return;const sp=60/128/2;while(mnext<ac.currentTime+.3){const t=mnext,i=mstep%16,bar=(mstep>>4)%4;
 if(mstep%4===0){tone(t,120,40,.18,'sine',.9,mg)}
 if(i%2===0||play)tone(t,mf(BS[bar]),0,sp*1.8,'triangle',.5,mg);
 const a=ac.createOscillator(),gn=ac.createGain(),fl=ac.createBiquadFilter();a.type='sawtooth';a.frequency.value=mf(N[(i+bar*4)%16]+(bar%2?0:12));fl.type='lowpass';fl.frequency.value=play?2200:900;gn.gain.setValueAtTime(.18,t);gn.gain.exponentialRampToValueAtTime(.001,t+sp*.9);a.connect(fl);fl.connect(gn);gn.connect(mg);a.start(t);a.stop(t+sp);
 if(mstep%2===1)noise(t,.05,.25,9000,mg);
 mstep++;mnext+=sp}}
// ---- state
let mode='menu',play=false,P,B,E,EB,PU,PT,ST,score,combo,cmbT,time,spawn,lvl,shake,fps=60,fa=0,fc=0,flash=0;
ST=[];for(let i=0;i<90;i++)ST.push({x:Math.random()*W,y:Math.random()*H,z:Math.random()*2+.4});
const show=id=>{['menu','set','help','pause','over','skins','promo','mod','author'].forEach(k=>$(k).classList.toggle('hid',k!==id));$('ui').classList.toggle('hid',!id);$('tb').classList.toggle('hid',!!id);if(id==='help')$('ht').innerHTML=HELP[S.lang];if(id==='author')$('au').innerHTML=AUTH[S.lang];applyLang()};
function reset(){evN=0;nextEv=60;FZ=0;P={x:W/2,y:H-110,hp:3,sh:0,w:1,cd:0,inv:0};B=[];E=[];EB=[];PU=[];PT=[];RG=[];TX=[];score=0;combo=1;cmbT=0;time=0;spawn=1;lvl=1;prog=0;BOSS=null;banner={s:'LEVEL 1',t:2};shake=0}
function start(){initA();reset();applyPromo();mode='play';play=true;show(null);sfx('start')}
function endG(){play=false;mode='over';sfx('over');const gain=Math.floor(score/10);S.coins+=gain;let t=score>S.best?tr('🎉 Yangi rekord!'):tr('Rekord')+': '+S.best;if(score>S.best)S.best=score;$('fb').textContent=t+'   🪙 +'+gain;save();$('fs').textContent=score;syncUI();show('over')}

let back='menu';
const cl=(id,f)=>$(id).onclick=()=>{initA();sfx('pick');f()};
cl('bPlay',start);cl('bAgain',start);cl('bSet',()=>{back='menu';show('set')});cl('bHelp',()=>show('help'));
cl('bBack',()=>show(back));cl('bBack2',()=>show('menu'));cl('bRes',resume);cl('bSet2',()=>{back='pause';show('set')});
cl('bQuit',()=>{mode='menu';show('menu')});cl('bMenu',()=>{mode='menu';show('menu')});
// ---- input
const K={};addEventListener('keydown',e=>{K[e.code]=1;if(e.code==='KeyP'||e.code==='Escape'){mode==='play'?pause():mode==='pause'&&resume()}if(e.code==='Space'&&mode==='menu'&&e.target.tagName!=='INPUT')start()});
addEventListener('keyup',e=>K[e.code]=0);
let tp=null;
function wp(e){return{x:(e.clientX*(devicePixelRatio||1)-ox)/sc,y:(e.clientY*(devicePixelRatio||1)-oy)/sc}}
cv.addEventListener('pointerdown',e=>{if(mode!=='play')return;try{cv.setPointerCapture(e.pointerId)}catch(_){}const p=wp(e);tp={dx:P.x-p.x,dy:P.y-p.y}});
cv.addEventListener('pointermove',e=>{if(!tp||mode!=='play')return;const p=wp(e);P.x=p.x+tp.dx;P.y=p.y+tp.dy});
addEventListener('pointerup',()=>tp=null);addEventListener('pointercancel',()=>tp=null);
document.addEventListener('visibilitychange',()=>document.hidden&&pause());

function shoot(){const w=P.w,y=P.y-18;const add=(a,dx)=>{for(let m=0;m<MSX;m++)B.push({x:P.x+dx+(m-(MSX-1)/2)*7,y,vx:Math.sin(a)*520,vy:-Math.cos(a)*620})};

function mk(type){const e={type,x:R(40,W-40),y:-30,t:0,f:R(.5,1.5),r:16,hp:1,vx:0,vy:R(70,120)+lvl*6,sx:0};
 if(type===1){e.hp=2;e.vy=90;e.sx=e.x}
 if(type===2){e.hp=5+lvl;e.r=24;e.vy=45}
 if(type===3){e.hp=1;e.r=13;e.vy=180}E.push(e)}
function hurt(){if(P.inv>0||GOD)return;if(P.sh>0){P.sh=0;P.inv=1;sfx('hit');flash=.2;boom(P.x,P.y,25,'#4dffb0');return}
 P.hp--;P.inv=1.6;shake=14;flash=.35;P.w=Math.max(1,P.w-1);combo=1;sfx('hurt');boom(P.x,P.y,40,'#ff5566');if(P.hp<=0){boom(P.x,P.y,120,'#00e5ff',1.4);endG()}}
function kill(e){if(!BOSS)prog+=e.type===2?3:1;TX.push({x:e.x,y:e.y,t:.9,s:'+'+Math.round((e.type===2?300:e.type===1?150:100)*combo)});score+=(e.type===2?300:e.type===1?150:100)*combo;combo=Math.min(8,combo+ (e.type===2?2:1)*0.5);cmbT=2.5;boom(e.x,e.y,e.type===2?70:30,e.type===3?'#ffb020':e.type===2?'#ff2bd6':'#ff6a3d');sfx('boom');shake=Math.max(shake,e.type===2?10:4);
 if(Math.random()<(e.type===2?.6:.11)){const k=['p','s','h'];PU.push({x:e.x,y:e.y,k:k[Math.random()*3|0]})}}
// ---- update
function upd(dt){time+=dt;FZ-=dt;if(time>=nextEv){evN++;nextEv+=60;runEv((evN-1)%4)}
 let mx=(K.ArrowRight||K.KeyD?1:0)-(K.ArrowLeft||K.KeyA?1:0),my=(K.ArrowDown||K.KeyS?1:0)-(K.ArrowUp||K.KeyW?1:0);
 P.x+=mx*330*dt;P.y+=my*330*dt;P.x=Math.max(20,Math.min(W-20,P.x));P.y=Math.max(60,Math.min(H-30,P.y));
 P.inv-=dt;P.cd-=dt;if(P.cd<=0){shoot();P.cd=(.17-P.w*.012)*(RAPID||FZ>0?.45:1)}
 {const k=SK[S.skin];if(S.par||Math.random()<.5)k.en.forEach(ex=>PT.push({x:P.x+ex,y:P.y+16,vx:R(-20,20),vy:R(90,190),l:.45,m:.45,c:k.rb?`hsl(${time*300%360},100%,60%)`:k.tr[Math.random()*k.tr.length|0],r:R(2,4.5)}))}
 spawn-=dt*(BOSS?.3:1);if(spawn<=0){spawn=Math.max(.28,1.15-lvl*.09)/S.dif;const r=Math.random();mk(lvl>2&&r<.15?2:lvl>1&&r<.4?3:r<.7?0:1);if(lvl>3&&Math.random()<.3)mk(0)}
 cmbT-=dt;if(cmbT<=0)combo=1;if(!BOSS&&prog>=need())startBoss();bossUpd(dt);if(banner){banner.t-=dt;if(banner.t<=0)banner=null}
 B.forEach(b=>{b.x+=b.vx*dt;b.y+=b.vy*dt});B=B.filter(b=>b.y>-20&&b.x>-20&&b.x<W+20);
 E.forEach(e=>{e.t+=dt;e.y+=e.vy*dt;
  if(e.type===1)e.x=e.sx+Math.sin(e.t*3)*70;
  if(e.type===3&&!e.met){const a=Math.atan2(P.y-e.y,P.x-e.x);e.x+=Math.cos(a)*90*dt;}
  if(e.type===2){e.f-=dt;if(e.y>60&&e.y<380)e.y-=e.vy*dt*.9;if(e.f<=0){e.f=1.4/S.dif;const a=Math.atan2(P.y-e.y,P.x-e.x);for(let i=-1;i<=1;i++)EB.push({x:e.x,y:e.y,vx:Math.cos(a+i*.25)*190,vy:Math.sin(a+i*.25)*190})}}
  B.forEach(b=>{if(!b.d&&Math.hypot(b.x-e.x,b.y-e.y)<e.r+4){b.d=1;e.hp--;e.h=.08;sfx('hit');boom(b.x,b.y,3,'#fff',.4)}});
  if(e.hp<=0&&!e.dead){e.dead=1;kill(e)}
  else if(Math.hypot(P.x-e.x,P.y-e.y)<e.r+12&&!e.dead){e.dead=1;e.type===2||kill(e);hurt()}
  e.h-=dt});
 B=B.filter(b=>!b.d);E=E.filter(e=>!e.dead&&e.y<H+40);
 EB.forEach(b=>{b.x+=b.vx*dt;b.y+=b.vy*dt;if(Math.hypot(P.x-b.x,P.y-b.y)<12){b.d=1;hurt()}});EB=EB.filter(b=>!b.d&&b.y<H+20&&b.y>-20&&b.x>-20&&b.x<W+20);
 PU.forEach(u=>{u.y+=70*dt;if(Math.hypot(P.x-u.x,P.y-u.y)<26){u.d=1;sfx('pick');score+=50;if(u.k==='p')P.w=Math.min(4,P.w+1);else if(u.k==='s')P.sh=1;else if(u.k==='c')S.coins+=2;else P.hp=Math.min(5,P.hp+1);boom(u.x,u.y,20,'#fff')}});PU=PU.filter(u=>!u.d&&u.y<H+20);
 shake*=.9;flash-=dt}
function stars(dt,sp){ST.forEach(s=>{s.y+=s.z*sp*dt;if(s.y>H){s.y=0;s.x=Math.random()*W}})}
// ---- draw
function ship(x,y,c,s,d){g.save();g.translate(x,y);g.scale(s,d||s);g.shadowColor=c;g.shadowBlur=18;g.strokeStyle=c;g.lineWidth=2.5;g.fillStyle=c+'33';g.beginPath();g.moveTo(0,-20);g.lineTo(15,14);g.lineTo(0,7);g.lineTo(-15,14);g.closePath();g.fill();g.stroke();g.restore()}
function draw(dt){g.setTransform(1,0,0,1,0,0);g.fillStyle='#05060f';g.fillRect(0,0,cv.width,cv.height);
 const sx=S.shk&&shake>.5?R(-shake,shake):0,sy=S.shk&&shake>.5?R(-shake,shake):0;
 g.setTransform(sc,0,0,sc,ox+sx*sc,oy+sy*sc);
 g.beginPath();g.rect(-ox/sc,-oy/sc,cv.width/sc,cv.height/sc);g.clip();
 const gr=g.createLinearGradient(0,0,0,H);gr.addColorStop(0,'#0a0424');gr.addColorStop(1,'#04122a');g.fillStyle=gr;g.fillRect(-500,-500,W+1000,H+1000);bgD();
 ST.forEach(s=>{g.fillStyle=`rgba(200,225,255,${.25+s.z*.3})`;g.fillRect(s.x,s.y,s.z,s.z*(play?4:1.5))});
 g.strokeStyle='rgba(0,229,255,.06)';g.lineWidth=1;const off=(time*60)%50;for(let y=-50+off;y<H;y+=50){g.beginPath();g.moveTo(0,y);g.lineTo(W,y);g.stroke()}
 if(P&&(mode==='play'||mode==='pause'||mode==='over')){
  g.shadowBlur=12;drawBoss();B.forEach(b=>drawBul(g,b,SK[S.skin],time));
  g.shadowColor='#ff2b55';g.fillStyle='#ff5577';EB.forEach(b=>{g.beginPath();g.arc(b.x,b.y,5,0,7);g.fill()});
  E.forEach(e=>{const c=e.h>0?'#ffffff':['#ff6a3d','#b06bff','#ff2bd6','#ffb020'][e.type];g.save();g.translate(e.x,e.y);g.shadowColor=c;g.shadowBlur=16;g.strokeStyle=c;g.fillStyle=c+'30';g.lineWidth=2.5;g.beginPath();
   if(e.type===0){g.moveTo(0,16);g.lineTo(15,-12);g.lineTo(0,-5);g.lineTo(-15,-12)}
   else if(e.type===1){g.rect(-13,-13,26,26);g.moveTo(-13,0);g.lineTo(13,0)}
   else if(e.type===2){for(let i=0;i<6;i++){const a=i*1.047+e.t;g.lineTo(Math.cos(a)*24,Math.sin(a)*24)}}
   else{g.arc(0,0,12,0,7);g.moveTo(-6,-6);g.lineTo(6,6);g.moveTo(6,-6);g.lineTo(-6,6)}
   g.closePath();g.fill();g.stroke();g.restore()});
  PU.forEach(u=>{const c={p:'#00aaff',s:'#4dffb0',h:'#ff4466',c:'#ffd24a'}[u.k];g.shadowColor=c;g.strokeStyle=c;g.lineWidth=2.5;g.strokeRect(u.x-11,u.y-11,22,22);g.fillStyle=c;g.font='bold 14px sans-serif';g.textAlign='center';g.fillText(u.k==='h'?'+':u.k.toUpperCase(),u.x,u.y+5)});
  if(mode!=='over'&&(P.inv<=0||Math.floor(P.inv*14)%2)){if(combo>=4)aura();drawShip(g,P.x,P.y,SK[S.skin],1,time,P.w);
   
   if(P.sh){shieldFx(P.x,P.y,time)}}
  drawFX();hud2();g.shadowBlur=0;PT.forEach(p=>{g.globalAlpha=Math.max(0,p.l/p.m);g.fillStyle=p.c;g.fillRect(p.x,p.y,p.r,p.r)});g.globalAlpha=1;
  // HUD
  g.textAlign='left';g.fillStyle='#e8f0ff';g.font='bold 22px system-ui';g.fillText('⭐ '+score,14,34);
  g.font='14px system-ui';g.fillStyle='#8fa6ff';g.fillText(tr('Daraja')+' '+lvl+'   '+tr('Qurol')+' '+P.w+'   🪙 '+S.coins,14,54);
  g.textAlign='center';g.font='bold 16px system-ui';g.fillStyle='#bcd8ff';const tt=Math.floor(time);g.fillText(('0'+(tt/60|0)).slice(-2)+':'+('0'+tt%60).slice(-2),W/2,34);g.font='12px system-ui';g.fillStyle='#ff9be9';g.fillText(FZ>0?'🔥 '+Math.ceil(FZ)+'s':tr('Hodisa')+' '+Math.max(0,Math.ceil(nextEv-time))+'s',W/2,52);g.textAlign='left';
  if(combo>1){g.fillStyle='#ff2bd6';g.font='bold 20px system-ui';g.fillText('x'+combo.toFixed(1)+' COMBO',14,78)}
  g.textAlign='right';g.font='22px system-ui';g.fillStyle='#ff4466';g.fillText('♥'.repeat(P.hp),W-14,34);
  if(flash>0){g.fillStyle=`rgba(255,60,80,${flash})`;g.fillRect(0,0,W,H)}}
 if(S.fps){g.setTransform(1,0,0,1,0,0);g.fillStyle='#4dffb0';g.font='bold 14px monospace';g.textAlign='left';g.fillText('FPS '+fps,8,cv.height-10)}}
let last=performance.now();
function loop(n){requestAnimationFrame(loop);const dt=Math.min(.05,(n-last)/1000);last=n;fa+=dt;fc++;if(fa>=.5){fps=Math.round(fc/fa);fa=0;fc=0}
 if(play)upd(dt);fxU(dt);stars(dt,play?140:40);bgU(dt);
 PT&&(PT.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=.98;p.vy*=.98;p.l-=dt}),PT=PT.filter(p=>p.l>0));
 if(mode==='menu'||!P){time+=dt}draw(dt);
 if(pvOn){const q=$('pv').getContext('2d');q.clearRect(0,0,260,190);q.fillStyle='rgba(255,255,255,.5)';for(let i=0;i<20;i++)q.fillRect((i*67)%260,((i*41+time*90*(1+i%3))%190),1.5,6);drawShip(q,130,104+Math.sin(time*2)*4,SK[kv],3,time,4)}}
reset();syncUI();applyLang();requestAnimationFrame(loop);
</script></body></html>
